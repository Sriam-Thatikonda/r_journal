
- name: Diagnose keystore secret
  shell: bash
  env:
    KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  run: |
    set -euo pipefail

    echo "Secret length: ${#KEYSTORE_BASE64}"

    if [[ -z "$KEYSTORE_BASE64" ]]; then
      echo "ERROR: Secret is empty"
      exit 1
    fi

    if [[ ! "$KEYSTORE_BASE64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
      echo "ERROR: Secret contains invalid characters"
      exit 1
    fi

    if (( ${#KEYSTORE_BASE64} % 4 != 0 )); then
      echo "ERROR: Base64 length is not divisible by 4"
      exit 1
    fi

    echo "Base64 format looks valid"

    printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/test-keystore.jks

    echo "Decoded size: $(wc -c < /tmp/test-keystore.jks)"
