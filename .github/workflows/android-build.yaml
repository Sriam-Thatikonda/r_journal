
name: Build & Release APK

on:
  push:
    branches:
      - master
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Restore signing keystore from GitHub Secrets
      - name: Restore Android Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-key.jks

          if [ ! -s release-key.jks ]; then
            echo "ERROR: Keystore restoration failed"
            exit 1
          fi

          echo "Android signing keystore restored successfully"

      - name: Grant execute permission
        run: chmod +x gradlew

      # Build signed release APK using GitHub Secrets
      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Read Version
        id: version
        run: |
          VERSION=$(grep VERSION_NAME_PREFIX app/version.properties | cut -d'=' -f2)
          BUILD=$(grep BUILD_NUMBER app/version.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
           app/build/outputs/apk/release/r_journal-v${{ steps.version.outputs.version }}-build${{ steps.version.outputs.build }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Delete old Latest Release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: r_journal v${{ steps.version.outputs.version }} (Build ${{ steps.version.outputs.build }})
          body: |
            Automatically built from the latest commit.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always remove the temporary signing keystore
      - name: Cleanup Signing Keystore
        if: always()
        shell: bash
        run: |
          rm -f release-key.jks
          echo "Temporary signing keystore removed"
