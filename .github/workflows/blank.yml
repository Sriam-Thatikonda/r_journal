
name: R-Journal Android Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build R-Journal Release APK
    runs-on: ubuntu-latest

    env:
      VERSION_NAME_PREFIX: ${{ vars.VERSION_NAME_PREFIX || 'R-Journal' }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Setup Gradle and caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Restore Android signing keystore
      - name: Restore Android signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "Checking Android keystore secret..."

          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is empty"
            exit 1
          fi

          # Remove whitespace and line breaks
          NORMALIZED_BASE64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"

          echo "Original secret length: ${#KEYSTORE_BASE64}"
          echo "Normalized secret length: ${#NORMALIZED_BASE64}"

          # Validate Base64 characters
          if [[ ! "$NORMALIZED_BASE64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "ERROR: Invalid Base64 characters detected"
            exit 1
          fi

          # Validate Base64 length
          if (( ${#NORMALIZED_BASE64} % 4 != 0 )); then
            echo "ERROR: Base64 length is not divisible by 4"
            exit 1
          fi

          echo "Base64 format validation passed"

          # Decode keystore
          printf '%s' "$NORMALIZED_BASE64" | base64 --decode > release-key.jks

          # Verify restored file
          if [[ ! -s release-key.jks ]]; then
            echo "ERROR: Restored keystore is empty"
            exit 1
          fi

          KEYSTORE_SIZE=$(wc -c < release-key.jks)

          echo "Keystore restored successfully"
          echo "Restored keystore size: ${KEYSTORE_SIZE} bytes"

      # 5. Build signed release APK
      - name: Build Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --no-daemon clean assembleRelease

      # 6. Rename APK
      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          if [[ ! -f "$APK_PATH" ]]; then
            echo "ERROR: Release APK not found"
            find app/build/outputs/apk -type f || true
            exit 1
          fi

          APK_NAME="${VERSION_NAME_PREFIX}-${BUILD_NUMBER}.apk"

          cp "$APK_PATH" "dist/${APK_NAME}"

          echo "APK prepared: ${APK_NAME}"
          ls -lh dist/

      # 7. Upload APK as workflow artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # 8. Delete previous latest release and tag
      - name: Delete previous latest release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        continue-on-error: true
        with:
          tag_name: latest
          delete_release: true
          delete_tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. Publish latest release
      - name: Publish latest GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: R-Journal Latest Release
          body: |
            Latest automatically generated R-Journal release.

            Build number: ${{ github.run_number }}
            Commit: ${{ github.sha }}

            Download the APK below and install it on your Android device.
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
          fail_on_unmatched_files: true

      # 10. Remove signing keystore
      - name: Cleanup signing keystore
        if: always()
        shell: bash
        run: |
          rm -f release-key.jks
          echo "Signing keystore cleanup completed"
